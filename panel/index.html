<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sofi Panel</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --line: #262b36; --text: #e7e9ee; --dim: #8b93a5;
    --ok: #3ecf8e; --warn: #f5b84a; --bad: #f2555a; --accent: #7c8cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 16px; display: flex; align-items: center; gap: 12px; }
  h1 .spacer { flex: 1; }
  h2 { font-size: 15px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 28px 0 10px; }
  button, input, select { font: inherit; color: var(--text); background: #1f2430; border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d12; font-weight: 600; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .5; cursor: wait; }
  input { width: 100%; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .name { font-weight: 600; font-size: 15px; }
  .dim { color: var(--dim); }
  .small { font-size: 12px; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 10px 0; }
  dt { color: var(--dim); } dd { margin: 0; overflow-wrap: anywhere; }
  .actions { margin-top: 10px; }
  details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; color: var(--dim); }
  pre { background: #0b0d12; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 11.5px; max-height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  .settings { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 14px; margin-top: 10px; }
  .settings label { display: grid; gap: 3px; font-size: 12px; color: var(--dim); }
  .event { display: flex; align-items: center; gap: 14px; }
  .switch { width: 56px; height: 30px; border-radius: 99px; border: 1px solid var(--line); background: #2a2f3b; position: relative; padding: 0; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--dim); transition: transform .15s; }
  .switch.on { background: var(--ok); border-color: var(--ok); }
  .switch.on::after { transform: translateX(26px); background: #0b0d12; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #262b36; padding: 10px 16px; border-radius: 10px; display: none; max-width: calc(100% - 32px); }
  #toast.err { background: #4a1d20; }
  #login { max-width: 320px; margin: 18vh auto; }
  .boxerr { color: var(--bad); }
</style>
</head>
<body>
<main id="app"></main>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
