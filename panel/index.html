<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0c11">
<title>Sofi Panel</title>
<style>
  /* Midnight: deep navy surfaces, each bot carries its own colour (--c). Mobile first. */
  :root {
    --bg: #0a0c11; --surface: #12151c; --raised: #191d26; --line: #242a36; --line-2: #2f3646;
    --text: #e8eaf0; --dim: #8c95a8; --faint: #5d6678;
    --accent: #7c6cff;
    --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(1200px 500px at 50% -200px, #1a1640 0%, transparent 70%), var(--bg); color: var(--text); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  svg { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* header */
  header { position: sticky; top: 0; z-index: 20; background: rgba(10,12,17,.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  .bar { max-width: 1200px; margin: 0 auto; height: 58px; padding: 0 16px; display: flex; align-items: center; gap: 8px; }
  .logo { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), #c084fc); color: #fff; display: grid; place-items: center; font-weight: 700; box-shadow: 0 4px 16px rgba(124,108,255,.35); }
  .title { font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
  .spacer { flex: 1; }

  main { max-width: 1200px; margin: 0 auto; padding: 18px 16px calc(80px + env(safe-area-inset-bottom)); }

  /* buttons + inputs */
  button, input, select { font: inherit; color: inherit; }
  button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--raised); font-weight: 550; cursor: pointer; transition: background .15s, border-color .15s, color .15s; -webkit-tap-highlight-color: transparent; }
  button:hover { border-color: #3d4659; background: #1f2430; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #6a59f5; }
  button.danger { color: var(--bad); }
  button.danger:hover { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.4); }
  button.ghost { border-color: transparent; background: transparent; color: var(--dim); }
  button.ghost:hover { background: var(--raised); color: var(--text); }
  button.icon { width: 40px; padding: 0; }
  button.sm { height: 34px; padding: 0 12px; font-size: 13px; }
  button:disabled { opacity: .5; cursor: wait; }
  input, select { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg); font-size: 16px; /* 16px stops iOS zoom */ }
  input::placeholder { color: var(--faint); }
  option { background: var(--surface); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }

  /* overview */
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi .label { font-size: 12px; color: var(--dim); }
  .kpi .value { font-size: 28px; font-weight: 650; letter-spacing: -.02em; margin-top: 2px; }
  .kpi .value small { font-size: 15px; color: var(--faint); font-weight: 500; }
  .event { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
  .event.on { border-color: rgba(124,108,255,.5); background: linear-gradient(135deg, rgba(124,108,255,.14), rgba(124,108,255,.03)), var(--surface); }
  .event .text { flex: 1; min-width: 0; }
  .event .name { font-weight: 600; }
  .note, .event .sub { font-size: 12.5px; color: var(--dim); }
  .warnline { margin-top: 8px; font-size: 12.5px; color: var(--warn); }

  /* server sections */
  .server { margin-top: 28px; }
  .server-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .server-head .tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line-2); }
  .server-head .count { font-size: 12.5px; color: var(--faint); }
  .server-head button { margin-left: auto; }

  /* account cards: each one painted with its own --c */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .acc { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding-top: 18px; }
  .acc::before { content: ''; position: absolute; inset: 0 0 auto; height: 3px; background: var(--c); }
  .acc::after { content: ''; position: absolute; inset: 0 0 auto; height: 90px; background: linear-gradient(var(--c), transparent); opacity: .07; pointer-events: none; }
  .acc.down { border-color: rgba(248,113,113,.35); }
  .acc-head { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 44px; height: 44px; border-radius: 12px; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); display: grid; place-items: center; font-weight: 700; font-size: 17px; flex: none; }
  .who { flex: 1; min-width: 0; }
  .who .name { font-weight: 650; font-size: 16px; color: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
  .chip { font-size: 11px; color: var(--dim); background: var(--raised); border: 1px solid var(--line); padding: 1px 7px; border-radius: 6px; font-family: ui-monospace, Consolas, monospace; }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent); }
  .status.ok { color: var(--ok); } .status.warn { color: var(--warn); } .status.bad { color: var(--bad); }

  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-width: 0; }
  .stat .label { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
  .stat .value { font-weight: 600; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat .value.big { font-size: 18px; color: var(--c); }

  .alert { display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; font-size: 13px; }
  .alert.bad { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.3); color: #fecaca; }
  .alert.warn { background: rgba(251,191,36,.07); border: 1px solid rgba(251,191,36,.28); color: #fde68a; }
  .alert b { font-weight: 600; }
  .alert span { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }

  .actions { display: flex; gap: 8px; }
  .actions button { flex: 1; }
  .tools { display: flex; gap: 2px; border-top: 1px solid var(--line); padding-top: 8px; margin: 0 -8px -8px; }
  .tools button { flex: 1; padding: 0 6px; white-space: nowrap; }

  .boxerr { color: var(--bad); border-color: rgba(248,113,113,.35); }

  /* switch */
  .switch { width: 52px; height: 30px; padding: 0; border-radius: 99px; border: 1px solid var(--line-2); background: var(--raised); position: relative; flex: none; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--dim); transition: transform .2s, background .2s; }
  .switch.on, .switch.on:hover { background: var(--accent); border-color: var(--accent); }
  .switch.on::after { transform: translateX(22px); background: #fff; }

  /* sheet: bottom sheet on phones, centred dialog on desktop */
  dialog { border: 1px solid var(--line-2); border-bottom: none; padding: 0; margin: auto 0 0; width: 100%; max-width: 100%; max-height: 92vh; border-radius: 20px 20px 0 0; background: var(--surface); color: var(--text); }
  dialog::backdrop { background: rgba(3,4,8,.65); backdrop-filter: blur(3px); }
  dialog[open] { display: flex; flex-direction: column; animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: 12px 10px 12px 18px; border-bottom: 1px solid var(--line); }
  .sheet-head .title { flex: 1; min-width: 0; }
  .sheet-head .sub { font-size: 12.5px; color: var(--dim); font-weight: 400; }
  .sheet-head .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--accent)); flex: none; }
  .sheet-body { padding: 16px 18px; overflow: auto; }
  .sheet-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  .sheet-foot button { flex: 1; }
  .grabber { width: 38px; height: 4px; border-radius: 4px; background: var(--line-2); margin: 8px auto 0; }

  .fields { display: grid; gap: 14px; }
  .field { display: grid; gap: 6px; }
  .field .label { font-size: 13px; font-weight: 550; }
  .field .hint { font-size: 11px; color: var(--faint); font-family: ui-monospace, Consolas, monospace; }
  .group { font-size: 11.5px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 20px 0 10px; }
  .group:first-child { margin-top: 0; }

  /* logs: one entry per row */
  .logs { display: flex; flex-direction: column; gap: 6px; }
  .day { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; text-align: center; margin: 8px 0 2px; }
  .log { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 2px 10px; padding: 9px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--line-2); }
  .log time { font: 12px ui-monospace, Consolas, monospace; color: var(--faint); padding-top: 1px; }
  .log .msg { font-size: 13px; overflow-wrap: anywhere; }
  .log .detail { grid-column: 2; font-size: 11.5px; color: var(--faint); overflow-wrap: anywhere; }
  .log.claim { border-left-color: var(--ok); }
  .log.claim .msg { color: #bbf7d0; font-weight: 550; }
  .log.warn { border-left-color: var(--warn); }
  .log.warn .msg { color: #fde68a; }
  .log.error { border-left-color: var(--bad); background: rgba(248,113,113,.06); }
  .log.error .msg { color: #fecaca; }
  .log.raw { grid-template-columns: minmax(0, 1fr); font: 12px ui-monospace, Consolas, monospace; color: var(--dim); }
  .filters { display: flex; gap: 6px; position: sticky; top: -16px; z-index: 1; margin: -16px 0 6px; padding: 14px 0 8px; background: var(--surface); }
  .filters button { height: 32px; font-size: 12.5px; border-radius: 99px; }
  .filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .login-box { width: 100%; max-width: 360px; text-align: center; }
  .login .logo { width: 58px; height: 58px; border-radius: 18px; font-size: 24px; margin: 0 auto 16px; }
  .login h1 { font-size: 21px; margin: 0; letter-spacing: -.01em; }
  .login .sub { color: var(--dim); font-size: 13px; }
  .login .card { margin-top: 24px; padding: 22px; text-align: left; display: grid; gap: 14px; }
  .login .foot { font-size: 12px; color: var(--faint); margin-top: 20px; }

  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50; background: var(--raised); border: 1px solid var(--line-2); color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.4); display: none; width: max-content; max-width: calc(100% - 32px); }
  #toast.err { background: #3b1518; border-color: rgba(248,113,113,.5); color: #fecaca; }

  .hide-sm { display: none; }

  @media (min-width: 640px) {
    main { padding-top: 26px; }
    .kpis { grid-template-columns: repeat(3, 1fr); }
    .event { grid-column: auto; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hide-sm { display: inline; }
    dialog { margin: auto; width: 600px; border-radius: 18px; border-bottom: 1px solid var(--line-2); box-shadow: 0 30px 80px rgba(0,0,0,.5); }
    .grabber { display: none; }
    .sheet-foot button { flex: none; }
    .fields.two { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 1024px) {
    .kpis { grid-template-columns: 1fr 1fr 2fr; }
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="sheet"></dialog>
<div id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
