<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Sofi Panel</title>
<style>
  /* EaseCab look: airy light, one blue accent, slate text. Mobile first. */
  :root {
    --brand: #2563eb; --brand-deep: #1e40af; --sky: #eff4ff;
    --bg: #f8fafc; --card: #fff; --line: #e2e8f0;
    --ink: #0f172a; --ink-60: #64748b; --ink-40: #94a3b8;
    --ok: #059669; --ok-bg: #ecfdf5; --warn: #b45309; --warn-bg: #fffbeb; --bad: #dc2626; --bad-bg: #fef2f2;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
    --r: 12px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* header */
  header { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  .bar { max-width: 1200px; margin: 0 auto; height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 10px; }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .title { font-weight: 600; font-size: 16px; }
  .spacer { flex: 1; }

  main { max-width: 1200px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
  h2 { font-size: 13px; font-weight: 600; color: var(--ink-60); text-transform: uppercase; letter-spacing: .05em; margin: 28px 0 10px; display: flex; align-items: center; gap: 8px; }
  h2 .count { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink-40); }
  h2 button { margin-left: auto; text-transform: none; letter-spacing: 0; }

  /* buttons + inputs */
  button, input, select { font: inherit; color: inherit; }
  button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-weight: 500; cursor: pointer; transition: background .15s, border-color .15s; -webkit-tap-highlight-color: transparent; }
  button:hover { background: var(--bg); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.primary:hover { background: var(--brand-deep); }
  button.danger { color: var(--bad); }
  button.danger:hover { background: var(--bad-bg); border-color: #fecaca; }
  button.ghost { border-color: transparent; background: transparent; color: var(--ink-60); }
  button.ghost:hover { background: var(--bg); color: var(--ink); }
  button.icon { width: 40px; padding: 0; }
  button.sm { height: 34px; padding: 0 12px; font-size: 13px; }
  button:disabled { opacity: .55; cursor: wait; }
  input, select { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 16px; /* 16px stops iOS zoom */ }
  input::placeholder { color: var(--ink-40); }

  /* cards */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi .label { font-size: 12px; color: var(--ink-60); }
  .kpi .value { font-size: 24px; font-weight: 600; margin-top: 2px; letter-spacing: -.01em; }
  .kpi .value small { font-size: 14px; color: var(--ink-40); font-weight: 500; }
  .event { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
  .event .text { flex: 1; min-width: 0; }
  .event .name { font-weight: 600; }
  .warnline { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .acc { display: flex; flex-direction: column; gap: 14px; }
  .acc-head { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--sky); color: var(--brand); display: grid; place-items: center; font-weight: 600; flex: none; }
  .acc-head .who { flex: 1; min-width: 0; }
  .acc-head .name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { font-size: 12px; color: var(--ink-60); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--bg); border-radius: 10px; }
  .stat { padding: 10px 12px; min-width: 0; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat .label { font-size: 11px; color: var(--ink-60); }
  .stat .value { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .errline { padding: 8px 10px; border-radius: 8px; background: var(--bad-bg); color: var(--bad); font-size: 12px; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions .grow { flex: 1; }
  .tools { display: flex; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; margin: 0 -6px -6px; }
  .tools button { flex: 1; padding: 0 6px; white-space: nowrap; }

  .pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 500; white-space: nowrap; background: #f1f5f9; color: var(--ink-60); }
  .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .boxerr { color: var(--bad); background: var(--bad-bg); border-color: #fecaca; }

  /* switch */
  .switch { width: 52px; height: 30px; padding: 0; border-radius: 99px; border: none; background: #cbd5e1; position: relative; flex: none; }
  .switch:hover { background: #b8c4d4; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(15,23,42,.2); transition: transform .2s; }
  .switch.on, .switch.on:hover { background: var(--brand); }
  .switch.on::after { transform: translateX(22px); }

  /* sheet: bottom sheet on phones, centred dialog on desktop */
  dialog { border: none; padding: 0; margin: auto 0 0; width: 100%; max-width: 100%; max-height: 90vh; border-radius: 18px 18px 0 0; background: #fff; color: var(--ink); box-shadow: 0 -8px 30px rgba(15,23,42,.15); }
  dialog::backdrop { background: rgba(15,23,42,.4); }
  dialog[open] { display: flex; flex-direction: column; animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } }
  .sheet-head { display: flex; align-items: center; gap: 8px; padding: 14px 12px 10px 18px; border-bottom: 1px solid var(--line); }
  .sheet-head .title { flex: 1; min-width: 0; }
  .sheet-head .sub { white-space: normal; }
  .sheet-body { padding: 16px 18px; overflow: auto; }
  .sheet-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  .sheet-foot button { flex: 1; }
  .grabber { width: 36px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 0; }

  .fields { display: grid; gap: 12px; }
  .field { display: grid; gap: 5px; }
  .field .label { font-size: 13px; font-weight: 500; }
  .field .hint { font-size: 11px; color: var(--ink-40); font-family: ui-monospace, Consolas, monospace; }
  .group { font-size: 12px; font-weight: 600; color: var(--ink-60); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 8px; }
  .group:first-child { margin-top: 0; }
  .note { font-size: 13px; color: var(--ink-60); margin: 10px 0 0; }
  pre { margin: 0; background: #0f172a; color: #e2e8f0; border-radius: 10px; padding: 12px; font: 11.5px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 200px; }

  /* login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: linear-gradient(var(--sky), var(--bg)); }
  .login-box { width: 100%; max-width: 360px; text-align: center; }
  .login .logo { width: 56px; height: 56px; border-radius: 16px; font-size: 24px; margin: 0 auto 14px; box-shadow: var(--shadow); }
  .login h1 { font-size: 20px; margin: 0; }
  .login .card { margin-top: 22px; padding: 22px; text-align: left; display: grid; gap: 14px; }
  .login .foot { font-size: 12px; color: var(--ink-40); margin-top: 20px; }

  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(15,23,42,.2); display: none; width: max-content; max-width: calc(100% - 32px); }
  #toast.err { background: var(--bad); }

  .hide-sm { display: none; }

  @media (min-width: 640px) {
    main { padding-top: 24px; }
    .kpis { grid-template-columns: repeat(3, 1fr); }
    .event { grid-column: auto; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hide-sm { display: inline; }
    dialog { margin: auto; width: 560px; border-radius: 16px; box-shadow: 0 20px 50px rgba(15,23,42,.2); }
    .grabber { display: none; }
    .sheet-foot button { flex: none; }
    .fields.two { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 1024px) {
    .kpis { grid-template-columns: 1fr 1fr 2fr; }
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="sheet"></dialog>
<div id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
